[loggers]
keys=root

[handlers]
keys=consoleHandler

[formatters]
keys=defaultFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=defaultFormatter
args=(sys.stdout,)

[formatter_defaultFormatter]
format=%(asctime)s - %(name)s - %(message)s - %(pathname)s - %(funcName)s - %(lineno)d
datefmt=%Y-%m-%d %H:%M:%S

[formatter_exceptionFormatter]
format=%(asctime)s - %(name)s - %(message)s
datefmt=%d-%m-%y %H:%M:%S